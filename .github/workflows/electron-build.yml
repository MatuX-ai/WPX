name: Electron Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，留空使用 package.json 中的版本）'
        required: false
        type: string

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: WPX-Setup-*.exe
          - os: macos-latest
            platform: mac
            artifact_name: WPX-*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_name: WPX-*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/ci-linux-deps.sh

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install wpx-app dependencies
        run: npm install --legacy-peer-deps
        working-directory: wpx-app

      - name: Install platform native bindings
        if: matrix.platform != 'win'
        run: bash scripts/ci-install-native-bindings.sh

      - name: Prepare build resources
        run: mkdir -p resources/fonts
        shell: bash

      - name: Verify native bindings
        if: matrix.platform != 'win'
        working-directory: wpx-app
        run: node scripts/ci-verify-native-bindings.mjs

      - name: Build frontend (${{ matrix.platform }})
        env:
          WPX_PRERENDER: '0'
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm --prefix wpx-app run build
          else
            node wpx-app/scripts/ci-vite-build.mjs
          fi
        shell: bash

      - name: Package Electron app (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} -p never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WPX-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/${{ matrix.artifact_name }}
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: ls -laR artifacts/ || echo "No artifacts found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
